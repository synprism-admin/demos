<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Synprism Demo Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Open Sans', sans-serif;
    background: #0f1117;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 560px;
    text-align: center;
  }
  .code {
    font-size: 96px;
    font-weight: 700;
    color: #00d4ff;
    line-height: 1;
    margin-bottom: 16px;
    letter-spacing: -4px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #fff;
  }
  p {
    font-size: 15px;
    color: rgba(255,255,255,.6);
    line-height: 1.7;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    background: #00d4ff;
    color: #0f1117;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .8px;
    text-decoration: none;
    padding: 13px 28px;
    margin: 0 6px 12px;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-outline {
    background: transparent;
    color: rgba(255,255,255,.7);
    border: 1px solid rgba(255,255,255,.25);
  }
  .btn-outline:hover { border-color: rgba(255,255,255,.6); color: #fff; opacity: 1; }
  .rule {
    width: 40px;
    height: 2px;
    background: #00d4ff;
    margin: 0 auto 24px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <div class="rule"></div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or may have been moved. If you were looking for a specific demo, use the button below to return to the demos index.</p>
    <div>
      <a href="/index.html" class="btn">BACK TO DEMOS</a>
      <a href="javascript:history.back()" class="btn btn-outline">GO BACK</a>
    </div>
  </div>
</body>
</html>
